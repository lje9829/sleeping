name: SleepFirst
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    APP_GROUP_IDENTIFIER: group.kr.sleepfirst.mvp
    BASE_BUNDLE_ID: kr.sleepfirst.mvp
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  SleepFirst:
    type: application
    platform: iOS
    sources: [App, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BASE_BUNDLE_ID)
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: 폰을 먼저 재운다
        UILaunchScreen: {}
        SleepFirstAppGroup: $(APP_GROUP_IDENTIFIER)
    entitlements:
      path: App/SleepFirst.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: ["$(APP_GROUP_IDENTIFIER)"]
    dependencies:
      - target: BedtimeMonitor
        embed: true
  BedtimeMonitor:
    type: app-extension
    platform: iOS
    sources: [Monitor, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BASE_BUNDLE_ID).monitor
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: Monitor/Info.plist
      properties:
        SleepFirstAppGroup: $(APP_GROUP_IDENTIFIER)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).BedtimeMonitor
    entitlements:
      path: Monitor/BedtimeMonitor.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: ["$(APP_GROUP_IDENTIFIER)"]
